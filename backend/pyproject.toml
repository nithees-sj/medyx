[project]
name = "healththread-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs the docker stack (Postgres + HAPI)", "ai: makes real Gemini calls"]
addopts = "-m 'not ai'"

[tool.ruff.lint.per-file-ignores]
# Long literal strings are the synthetic documents' printed text.
"scripts/generate_demo_docs.py" = ["E501"]
